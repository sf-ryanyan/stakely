<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stakely — Investor Portal Demo</title>
<meta name="description" content="Stakely is an investor relations portal for private companies: a public company page, an invite-only data room, a shareholder dashboard, a board room and an admin console. Demo with a fictional company.">
<meta name="theme-color" content="#1C2B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stakely">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231C2B4A'/%3E%3Cpath d='M20 42c4 4 20 4 22-3 2-8-20-6-19-15 1-7 15-7 20-2' stroke='%23C8892E' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1C2B4A; --navy-2:#24365C; --navy-deep:#141F36;
  --gold:#C8892E; --gold-2:#B57A25; --gold-soft:#F3E3C8;
  --sand:#F4EFE6; --paper:#FBF8F3; --white:#FFFFFF;
  --mist:#8A97A8; --ink:#16202F; --ink-2:#3E4A5C; --line:#E4DCCD; --line-2:#EDE7DC;
  --ok:#4F7A5A; --ok-soft:#E3EEE5; --bad:#A84B3A; --bad-soft:#F6E2DD; --info-soft:#E4E9F2;
  --serif:"Cormorant Garamond","Noto Serif SC","Songti SC",Georgia,serif;
  --sans:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(20,31,54,.04),0 8px 28px rgba(20,31,54,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--sand);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.muted{color:var(--mist)}
.small{font-size:13px}
.serif{font-family:var(--serif)}
.hide{display:none!important}

/* demo bar */
.demobar{background:var(--navy-deep);color:#C9D1DD;font-size:12.5px;padding:8px 0;position:relative;z-index:30}
.demobar .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.demobar b{color:#fff;font-weight:600}
.demobar a{color:var(--gold);text-decoration:none;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:12px 22px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:.18s;white-space:nowrap}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--gold-2)}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy-2)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.45);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-line{background:#fff;border-color:var(--line);color:var(--ink)}.btn-line:hover{border-color:var(--navy)}
.btn-sm{padding:8px 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.lang.dark{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}

/* ---------- PUBLIC ---------- */
.pnav{position:absolute;top:0;left:0;right:0;z-index:20}
.pnav .wrap{display:flex;align-items:center;justify-content:space-between;height:84px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.mark{width:38px;height:38px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:17px;letter-spacing:.02em}
.brand .nm{font-family:var(--serif);font-size:23px;font-weight:600;line-height:1;white-space:nowrap}
.brand .sub{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.75;margin-top:3px}
.pnav .brand{color:#fff}
.pnav ul{display:flex;gap:30px;list-style:none;margin:0;padding:0}
.pnav ul a{color:#fff;text-decoration:none;font-size:14px;opacity:.88}
.pnav ul a:hover{opacity:1}
.pnav .right{display:flex;align-items:center;gap:12px}
.hero{position:relative;min-height:94vh;display:flex;align-items:flex-end;color:#fff;background:var(--navy) center/cover no-repeat}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,31,54,.92) 0%,rgba(28,43,74,.72) 42%,rgba(28,43,74,.18) 100%),linear-gradient(0deg,rgba(20,31,54,.55),rgba(20,31,54,0) 40%)}
.hero>.wrap{position:relative;width:100%;padding-top:180px;padding-bottom:84px}
.hero h1{font-size:clamp(48px,7.4vw,104px);max-width:820px;margin:18px 0 22px;font-weight:600}
.hero h1 em{font-style:italic;color:var(--gold-soft)}
.hero p.lead{font-size:clamp(17px,1.6vw,20px);max-width:560px;opacity:.88}
.hero .ctas{display:flex;gap:14px;margin-top:36px;flex-wrap:wrap}
.hero .facts{display:flex;gap:56px;margin-top:72px;padding-top:28px;border-top:1px solid rgba(255,255,255,.18);flex-wrap:wrap}
.hero .facts b{display:block;font-family:var(--serif);font-size:44px;font-weight:600;line-height:1}
.hero .facts span{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.sec{padding:128px 0}
.sec.alt{background:var(--paper)}
.sec h2{font-size:clamp(38px,4.6vw,62px);margin:16px 0 22px}
.sec .lead{font-size:18px;color:var(--ink-2);max-width:620px}
.split{display:grid;grid-template-columns:1.05fr 1fr;gap:88px;align-items:center}
.split.rev{grid-template-columns:1fr 1.05fr}
.split .img{border-radius:6px;overflow:hidden;aspect-ratio:4/5;background:var(--line)}
.split .img img{width:100%;height:100%;object-fit:cover}
.values{display:grid;gap:26px;margin-top:40px}
.values>div{display:grid;grid-template-columns:44px 1fr;gap:14px}
.values .n{font-family:var(--serif);font-size:30px;color:var(--gold);line-height:1}
.values h3{font-size:24px;margin-bottom:4px}
.values p{color:var(--ink-2)}
.stores{display:grid;gap:0;margin-top:36px;border-top:1px solid var(--line)}
.stores .row{display:grid;grid-template-columns:1fr auto;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}
.stores .row b{font-family:var(--serif);font-size:25px;font-weight:600}
.stores .row span{color:var(--mist);font-size:13.5px}
.stores .next b{color:var(--gold)}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:72px;border-top:1px solid var(--line)}
.road div{padding:26px 24px 0 0}
.road b{display:block;font-family:var(--serif);font-size:54px;line-height:1;color:var(--navy)}
.road span{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.road div.now b{color:var(--gold)}
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:56px}
.person{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px}
.avatar{width:58px;height:58px;border-radius:50%;background:var(--navy);color:var(--gold-soft);display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:600;flex:none}
.person h3{font-size:26px;margin:20px 0 2px}
.person .role{color:var(--gold);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.person p{color:var(--ink-2);margin-top:12px;font-size:14.5px}
.teamimg{margin-top:56px;border-radius:6px;overflow:hidden;aspect-ratio:21/8}
.teamimg img{width:100%;height:100%;object-fit:cover}
.news{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:52px}
.news article{border-top:2px solid var(--navy);padding-top:22px}
.news time{font-size:12.5px;color:var(--mist);letter-spacing:.06em}
.news h3{font-size:26px;margin:10px 0 10px}
.news p{color:var(--ink-2);font-size:14.5px}
.faq{margin-top:44px;border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line);padding:22px 0}
.faq summary{cursor:pointer;list-style:none;font-family:var(--serif);font-size:24px;font-weight:600;display:flex;justify-content:space-between;gap:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";color:var(--gold);font-family:var(--sans);font-weight:400}
.faq details[open] summary:after{content:"–"}
.faq details p{color:var(--ink-2);margin-top:12px;max-width:760px}
.interest{background:var(--navy);color:#fff}
.interest .lead{color:#C9D1DD}
.formcard{background:#fff;color:var(--ink);border-radius:var(--r);padding:36px;box-shadow:0 30px 60px rgba(0,0,0,.25)}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2);letter-spacing:.02em}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--paper);outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);background:#fff}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);margin:6px 0 18px}
.check input{margin-top:4px;accent-color:var(--gold)}
.disc{font-size:12px;color:var(--mist);margin-top:14px;line-height:1.55}
.pfoot{background:var(--navy-deep);color:#93A0B4;padding:56px 0;font-size:13px}
.pfoot .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}
.pfoot .brand{color:#fff}
.pfoot p{max-width:520px;margin-top:14px}
.pfoot a{color:var(--gold);text-decoration:none}

/* ---------- LOGIN ---------- */
.login{min-height:calc(100vh - 36px);display:grid;grid-template-columns:1fr 1.1fr}
.login .art{position:relative;background:var(--navy) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px}
.login .art:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,31,54,.86),rgba(28,43,74,.66) 50%,rgba(20,31,54,.92))}
.login .art>*{position:relative}
.login .art h1{font-size:clamp(40px,4.4vw,64px);margin:18px 0 18px}
.login .art p{opacity:.85;max-width:440px}
.login .pick{padding:56px clamp(24px,5vw,72px);background:var(--paper);overflow:auto}
.login .pick h2{font-size:40px;margin:10px 0 8px}
.roles{display:grid;gap:12px;margin-top:30px}
.rolecard{display:grid;grid-template-columns:48px 1fr auto;gap:16px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;cursor:pointer;transition:.18s;width:100%}
.rolecard:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:var(--shadow)}
.rolecard .ic{width:48px;height:48px;border-radius:12px;background:var(--sand);display:grid;place-items:center;color:var(--navy)}
.rolecard b{display:block;font-size:15.5px;color:var(--ink)}
.rolecard span{display:block;font-size:13px;color:var(--mist);margin-top:2px}
.rolecard .go{color:var(--gold);font-weight:700}
.prodlogin{margin-top:28px;border:1px dashed var(--line);border-radius:var(--r);padding:18px 20px;font-size:13px;color:var(--ink-2);display:flex;gap:12px;align-items:flex-start}

/* ---------- PORTAL SHELL ---------- */
.shell{display:grid;grid-template-columns:268px 1fr;min-height:calc(100vh - 36px)}
.side{background:var(--navy);color:#C9D1DD;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.side .top{padding:26px 22px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .brand{color:#fff}
.side .area{margin-top:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.side nav{padding:14px 12px;display:grid;gap:2px}
.side nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:14px;color:#C9D1DD}
.side nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav a.on{background:rgba(200,137,46,.16);color:#fff}
.side nav a.on svg{color:var(--gold)}
.side nav .grp{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:#6F7E96;padding:16px 12px 6px}
.side nav .badge{margin-left:auto;background:var(--gold);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px}
.side .me{margin-top:auto;padding:18px 20px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center}
.side .me .avatar{width:40px;height:40px;font-size:16px;background:var(--gold);color:#fff}
.side .me b{color:#fff;font-size:14px;display:block}
.side .me span{font-size:12px}
.side .acts{display:flex;gap:8px;padding:0 20px 22px}
.side .acts .btn{flex:1;padding:8px 10px;font-size:12.5px;border-color:rgba(255,255,255,.2);color:#fff;background:transparent}
.side .acts .btn:hover{background:rgba(255,255,255,.08)}
.mainp{min-width:0}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 36px;border-bottom:1px solid var(--line);background:rgba(244,239,230,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.topbar h1{font-size:28px}
.topbar .r{display:flex;gap:10px;align-items:center}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:10px;width:40px;height:40px;place-items:center;cursor:pointer}
.content{padding:32px 36px 64px;max-width:1240px}
.co-banner{display:flex;gap:18px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;margin-bottom:24px;flex-wrap:wrap}
.co-banner .l{display:flex;gap:14px;align-items:center}
.co-banner .mark{color:var(--navy)}
.co-banner b{font-family:var(--serif);font-size:21px}
.notice{display:flex;gap:12px;align-items:flex-start;background:var(--gold-soft);border-radius:12px;padding:14px 16px;font-size:13.5px;color:#6B4A17;margin-bottom:22px}
.notice.navy{background:var(--info-soft);color:var(--navy)}
.notice.red{background:var(--bad-soft);color:#7A3226}

/* cards & grids */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;min-width:0}
.card h3{font-family:var(--sans);font-size:16.5px;font-weight:600;letter-spacing:-.005em}
.card .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card .hd .link{font-size:13px;color:var(--gold);font-weight:600;cursor:pointer;text-decoration:none}
.kpi .lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);font-weight:600}
.kpi .val{font-family:var(--sans);font-size:30px;font-weight:650;line-height:1.15;margin-top:6px;color:var(--navy);letter-spacing:-.02em;font-variant-numeric:tabular-nums lining-nums}
.kpi .sub{font-size:13px;color:var(--ink-2);margin-top:4px}
.up{color:var(--ok)!important}.down{color:var(--bad)!important}
.kpi.feature{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.feature .val{color:#fff}.kpi.feature .lbl{color:var(--gold)}.kpi.feature .sub{color:#C9D1DD}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sand);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.gold{background:var(--gold-soft);color:#7A5418}
.chip.navy{background:var(--info-soft);color:var(--navy)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;flex:none}

/* tables */
.tblw{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.tot td{font-weight:700;border-top:1px solid var(--line)}
.tbl tr.you td{background:#FBF5EA}

/* lists */
.list{display:grid}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line-2)}
.item:last-child{border-bottom:0}
.item .t{font-weight:600}
.item .m{font-size:12.5px;color:var(--mist)}
.fileic{width:40px;height:40px;border-radius:10px;background:var(--sand);display:grid;place-items:center;color:var(--navy)}

/* progress */
.bar{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px}
.bar.navy i{background:var(--navy)}
.bar.ok i{background:var(--ok)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink-2);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* tabs */
.tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:22px;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 18px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--navy);color:#fff}

/* report */
.letter{font-size:15.5px;color:var(--ink-2)}
.letter p{margin-bottom:14px}
.letter h4{font-family:var(--serif);font-size:22px;color:var(--ink);margin:22px 0 8px}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.wl div{border-radius:12px;padding:16px 18px}
.wl .w{background:var(--ok-soft)}.wl .l{background:var(--bad-soft)}
.wl b{display:block;margin-bottom:6px;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.wl ul{margin:0;padding-left:18px;font-size:14px}
.sign{font-family:var(--serif);font-size:24px;color:var(--navy);margin-top:6px}

/* qa */
.thread{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:#fff;margin-bottom:14px}
.thread .q{font-weight:600;font-size:15.5px}
.thread .meta{font-size:12.5px;color:var(--mist);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.thread .a{margin-top:14px;padding:14px 16px;background:var(--paper);border-radius:12px;border:1px solid var(--line-2);font-size:14.5px;color:var(--ink-2)}
.thread .a b{color:var(--ink)}

/* vote */
.vopts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.vopts button{flex:1;min-width:110px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;font-weight:600;cursor:pointer}
.vopts button:hover{border-color:var(--navy)}
.vopts button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tally{display:grid;gap:10px;margin-top:16px}
.tally .r{display:grid;grid-template-columns:72px 1fr 48px;gap:10px;align-items:center;font-size:13px}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;min-height:300px}
.col h4{margin:4px 4px 12px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.col h4 span{color:var(--mist)}
.kc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13.5px}
.kc b{display:block}
.kc .amt{font-family:var(--serif);font-size:21px;color:var(--navy);font-weight:600}
.kc .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.kc button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.kc button:hover{border-color:var(--gold);color:var(--gold)}
.kc.new{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,137,46,.15)}

/* perm matrix */
.perm td.c{text-align:center}
.tog{width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;border:0;cursor:pointer;vertical-align:middle}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s}
.tog.on{background:var(--ok)}.tog.on:after{left:19px}

/* deck */
.slide{aspect-ratio:16/9;border-radius:var(--r);background:var(--navy);color:#fff;padding:clamp(22px,4vw,52px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.slide.img{background:center/cover}
.slide.img:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,31,54,.9),rgba(20,31,54,.35))}
.slide>*{position:relative}
.slide h3{font-size:clamp(26px,3.6vw,48px);max-width:720px}
.slide .bul{display:grid;gap:8px;font-size:clamp(13px,1.3vw,16px);color:#D9DFE8;max-width:640px}
.slide .pg{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.slide .stats{display:flex;gap:clamp(18px,4vw,48px);flex-wrap:wrap}
.slide .stats b{display:block;font-family:var(--serif);font-size:clamp(28px,3.6vw,46px);line-height:1}
.slide .stats span{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#AEB9C9}
.deckctl{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold)}

/* slots */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.slots .day b{display:block;font-family:var(--serif);font-size:22px;margin-bottom:10px}
.slots button{display:block;width:100%;margin-bottom:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:pointer;font-weight:600}
.slots button:hover{border-color:var(--gold)}
.slots button.on{background:var(--gold);border-color:var(--gold);color:#fff}

/* gate */
.gate{max-width:640px;margin:20px auto}
.gate .card{padding:40px}
.gate h2{font-size:40px;margin:12px 0 10px}

/* modal & toast */
.ov{position:fixed;inset:0;background:rgba(20,31,54,.55);display:grid;place-items:center;z-index:100;padding:20px;animation:fade .15s}
.modal{background:#fff;border-radius:18px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:30px;position:relative}
.modal .x{position:absolute;top:14px;right:14px;border:0;background:var(--sand);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.modal h3{font-size:30px;margin-bottom:6px}
.docprev{position:relative;border:1px solid var(--line);border-radius:12px;padding:34px 34px 46px;margin-top:18px;background:var(--paper);overflow:hidden;min-height:340px}
.docprev .ln{height:10px;background:var(--line);border-radius:4px;margin-bottom:12px}
.docprev .wm{position:absolute;inset:-40%;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:60px 80px;transform:rotate(-24deg);pointer-events:none}
.docprev .wm span{font-size:15px;font-weight:700;color:rgba(28,43,74,.13);white-space:nowrap;letter-spacing:.06em}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:13px 20px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%)}
@keyframes fade{from{opacity:0}to{opacity:1}}

.foot-note{font-size:12px;color:var(--mist);margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}


/* ---------- v2: clarity layer ---------- */
.num,.tbl td,.tbl th{font-variant-numeric:tabular-nums lining-nums}
.content{max-width:1280px}
.topbar .tt{display:flex;flex-direction:column;justify-content:center}
.topbar .tsub{font-size:12px;color:var(--mist);margin-top:1px;display:flex;gap:6px;align-items:center}
.topbar .tsub i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.pagehd{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.pagehd h2{font-size:38px;margin-top:6px}
.sechd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px;flex-wrap:wrap}
.sechd h3{font-family:var(--sans);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);font-weight:700}
.sechd span{font-size:12.5px;color:var(--mist)}
.card{border-color:var(--line-2);box-shadow:0 1px 2px rgba(20,31,54,.03)}
.card .hd span.sub2{font-size:12.5px;color:var(--mist)}
.kpi .kt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kpi .lbl{display:inline-flex;align-items:center;gap:6px;font-size:11.5px}
.kpi .kv{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.kpi .kv svg{flex:none;margin-bottom:6px}
.kpi .sub{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mist)}
.delta{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--sand);color:var(--ink-2)}
.delta.up{background:var(--ok-soft);color:var(--ok)!important}
.delta.down{background:var(--bad-soft);color:var(--bad)!important}
.st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;display:inline-block}
.st.ok{color:var(--ok)}.st.ok i{background:var(--ok)}
.st.watch{color:#9A6A1C}.st.watch i{background:var(--gold)}
.st.bad{color:var(--bad)}.st.bad i{background:var(--bad)}
.st.pill{padding:4px 10px;border-radius:999px;background:var(--ok-soft)}
.st.pill.watch{background:var(--gold-soft)}.st.pill.bad{background:var(--bad-soft)}
.tip{width:17px;height:17px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--mist);font-size:10.5px;font-weight:700;line-height:1;display:inline-grid;place-items:center;cursor:pointer;padding:0;vertical-align:1px;flex:none;text-transform:none;letter-spacing:0}
.tip:hover{border-color:var(--gold);color:var(--gold)}
.summary{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:0;background:var(--navy);color:#fff;border-radius:18px;overflow:hidden;margin-bottom:28px}
.summary .sl{padding:30px 32px}
.summary .big{font-family:var(--serif);font-size:clamp(24px,2.4vw,32px);line-height:1.25;margin:12px 0 20px;font-weight:600}
.summary .sr{background:rgba(255,255,255,.05);padding:22px 26px;display:grid;align-content:center;gap:2px;border-left:1px solid rgba(255,255,255,.08)}
.summary .srow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;color:#D9DFE8}
.summary .srow:last-child{border-bottom:0}
.summary .st.ok{color:#9FD3AE}.summary .st.ok i{background:#7CC290}
.summary .st.watch{color:#F0C783}.summary .st.watch i{background:var(--gold)}
.ivrow{display:grid;grid-template-columns:1fr auto 1fr 1fr;gap:18px;align-items:end;margin:6px 0 18px}
.ivrow .lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mist);font-weight:600;display:flex;gap:6px;align-items:center}
.numl{font-size:28px;font-weight:650;letter-spacing:-.02em;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.numl.navy{color:var(--navy)}
.ivrow .arr{color:var(--mist);font-size:22px;padding-bottom:6px}
.cmp{display:grid;gap:8px;margin-bottom:16px}
.cmp .r{display:grid;grid-template-columns:92px 1fr 90px;gap:10px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.cmp .r b{text-align:right;font-variant-numeric:tabular-nums}
.cmp .trk{height:10px;background:var(--line-2);border-radius:999px;overflow:hidden}
.cmp .trk i{display:block;height:100%;border-radius:999px}
.metaline{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mist);padding-top:14px;border-top:1px solid var(--line-2)}
.metaline b{color:var(--ink);font-weight:600}
.act{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.act:last-child{border-bottom:0}
.act .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center}
.act.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.act .t{font-size:14px;font-weight:600}
.act.done .t{color:var(--mist);text-decoration:line-through;font-weight:500}
.act .m{font-size:12px;color:var(--mist)}
.act .m.soon{color:#9A6A1C;font-weight:600}
.progress-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.ytd{position:relative;height:12px;background:var(--line-2);border-radius:999px;margin:10px 0 6px}
.ytd i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:999px}
.ytd em{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--gold)}
.chart .cscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.chart .cscroll svg{min-width:600px}
.score td:first-child{font-weight:600}
.score td .why{display:block;font-weight:400;font-size:12px;color:var(--mist);margin-top:2px}
.score .bad-t{color:var(--bad);font-weight:600}.score .good-t{color:var(--ok);font-weight:600}
.scoresum{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.stack{display:flex;height:30px;border-radius:8px;overflow:hidden;margin:6px 0 4px}
.stack i{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;font-style:normal;white-space:nowrap;overflow:hidden}
.stackleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:12px}
.stackleg span{display:inline-flex;align-items:center;gap:6px}.stackleg em{width:10px;height:10px;border-radius:3px;display:inline-block}
.scard{display:grid;gap:14px}
.scard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.scard h4{font-family:var(--serif);font-size:24px;margin:0;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:14px;border-top:1px solid var(--line-2)}
.mini b{display:block;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.mini span{font-size:11.5px;color:var(--mist);text-transform:uppercase;letter-spacing:.06em}
.thesis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:1px solid var(--line-2)}
.thesis>div{padding:20px 22px 20px 0;border-bottom:1px solid var(--line-2)}
.thesis>div:nth-child(odd){padding-right:28px;border-right:1px solid var(--line-2)}
.thesis>div:nth-child(even){padding-left:28px}
.thesis .n{font-family:var(--serif);color:var(--gold);font-size:22px}
.thesis h4{font-family:var(--sans);font-size:15.5px;margin:4px 0 6px}
.thesis p{font-size:14px;color:var(--ink-2)}
.risk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;padding:14px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.risk:last-child{border-bottom:0}
.risk b{display:flex;gap:8px;align-items:flex-start}
.risk span{color:var(--ink-2)}
.snap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border:1px solid var(--line-2);border-radius:var(--r);margin-bottom:24px}
.snap>div{padding:18px 20px;border-right:1px solid var(--line-2)}
.snap>div:last-child{border-right:0}
.snap .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);font-weight:600;display:flex;gap:6px;align-items:center}
.snap b{display:block;font-size:22px;font-weight:650;color:var(--navy);margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.snap small{font-size:12px;color:var(--mist)}
.gloss h3{font-family:var(--serif)}
.gloss .ex{background:var(--paper);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14px;color:var(--ink-2)}
@media (max-width:1080px){
  .summary{grid-template-columns:1fr}.summary .sr{border-left:0;border-top:1px solid rgba(255,255,255,.08)}
  .snap{grid-template-columns:repeat(3,minmax(0,1fr))}.snap>div:nth-child(3){border-right:0}.snap>div:nth-child(-n+3){border-bottom:1px solid var(--line-2)}
}
@media (max-width:640px){
  .summary .sl{padding:22px 20px}.summary .sr{padding:14px 20px}
  .ivrow{grid-template-columns:1fr 1fr}.ivrow .arr{display:none}
  .numl{font-size:22px}
  .thesis{grid-template-columns:1fr}.thesis>div{padding:16px 0!important;border-right:0!important}
  .risk{grid-template-columns:1fr;gap:4px}
  .snap{grid-template-columns:1fr 1fr}.snap>div{border-right:0;border-bottom:1px solid var(--line-2)}
  .mini b{font-size:16px}
  .kpi .kv svg{display:none}
  .hm{display:none}
  .score .st{font-size:0;gap:0}
  .score td:first-child{min-width:140px}
  .kpi .kt .st{display:none}
  .pagehd h2{font-size:30px}
  .topbar .tsub{display:none}
}

@media (min-width:861px){.shell{background:linear-gradient(90deg,var(--navy) 268px,transparent 268px)}}

/* ---------- v3: interactive layer ---------- */
.since{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line-2);border-radius:14px;padding:10px 14px;margin-bottom:22px}
.since .lb{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-right:4px}
.since a{display:inline-flex;align-items:center;gap:6px;font-size:13px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;transition:.15s}
.since a:hover{border-color:var(--gold);color:var(--gold-2)}
.since a b{color:var(--ok)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(20,31,54,.12)}
.trend-ctl{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.trend-sum{font-size:13.5px;color:var(--ink-2);margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:22px}
.trend-sum b{font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cbox{position:relative;width:100%}
.donut-wrap{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.donut-c{position:relative;height:200px}
.donut-c .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-c .ctr b{display:block;font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.donut-c .ctr span{font-size:11.5px;color:var(--mist);text-transform:uppercase;letter-spacing:.08em}
.mixleg{display:grid;gap:2px}
.mixleg div{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;font-size:13.5px;padding:7px 0;border-bottom:1px solid var(--line-2)}
.mixleg div:last-child{border-bottom:0}
.mixleg i{width:12px;height:12px;border-radius:3px}
.mixleg b{font-variant-numeric:tabular-nums}
.mixleg span.m{color:var(--mist);font-variant-numeric:tabular-nums;font-size:12.5px;min-width:52px;text-align:right}
.heat{display:grid;grid-template-columns:44px repeat(12,minmax(0,1fr));gap:4px;font-size:11.5px}
.heat .hh{color:var(--mist);text-align:center}
.heat .dd{color:var(--ink-2);font-weight:600;display:flex;align-items:center}
.heat .c{aspect-ratio:1.45;border-radius:5px;transition:transform .15s}
.heat .c:hover{transform:scale(1.15);outline:2px solid var(--gold);z-index:2}
.heatleg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mist);margin-top:12px}
.heatleg .g{height:8px;width:140px;border-radius:999px;background:linear-gradient(90deg,rgba(28,43,74,.06),rgba(28,43,74,1))}
.mapwrap{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:0;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;background:#fff}
.mapwrap #mapsvg svg{display:block;width:100%;height:auto;background:#F7F3EC}
.mapinfo{padding:22px;border-left:1px solid var(--line-2);display:flex;flex-direction:column;gap:12px;min-height:100%}
.mapinfo .ph{border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:var(--sand)}
.mapinfo .ph img{width:100%;height:100%;object-fit:cover}
.mapinfo h4{font-family:var(--serif);font-size:26px;margin:0;font-weight:600}
.pin{cursor:pointer}
.pin:focus{outline:none}
.pin .hit{fill:transparent}
.pin:hover .dotc,.pin.sel .dotc{stroke:#C8892E;stroke-width:4}
.pin.sel .lbl2{font-weight:700;fill:#1C2B4A}
.pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.maplegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.maplegend span{display:inline-flex;gap:6px;align-items:center}
.maplegend em{width:11px;height:11px;border-radius:50%;display:inline-block}
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:20px;margin-bottom:20px}
.sl-row{margin-bottom:22px}
.sl-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.sl-row label{font-size:13.5px;font-weight:600;display:flex;gap:6px;align-items:center}
.sl-row output{font-size:20px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.sl-row .ends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mist);margin-top:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:var(--line-2);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--gold);box-shadow:0 2px 6px rgba(20,31,54,.2)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--gold)}
.switch{display:flex;justify-content:space-between;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .tg{width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
.switch .tg:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.tg{background:var(--ok)}.switch input:checked+.tg:after{left:21px}
.switch input:focus-visible+.tg{outline:2px solid var(--gold);outline-offset:2px}
.formula{font-size:13px;color:var(--ink-2);background:var(--paper);border-radius:10px;padding:10px 12px;margin-top:16px;font-variant-numeric:tabular-nums}
.simout{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:0;border-bottom:1px solid var(--line-2);padding-bottom:18px;margin-bottom:16px}

  return aSh*(aTake/A_SHARES) + common*(rest/SHARES_OUT);

/* mount & count-up */
function countUp(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('#content .kpi .val, #content .numl, #content .snap b').forEach(el=>{
    if(el.closest('[data-nocount]') || el.children.length) return;
    const txt=el.textContent.trim(), m=txt.match(/^([+\-−]?\$?)([\d,]+(?:\.\d+)?)(M|K|%|x| pts)?$/); if(!m) return;
    const target=parseFloat(m[2].replace(/,/g,'')), dec=(m[2].split('.')[1]||'').length, comma=m[2].includes(','), t0=performance.now(), dur=900;
    const fmt=v=>{ let s=v.toFixed(dec); if(comma){ const [a,b]=s.split('.'); s=Number(a).toLocaleString('en-US')+(b?'.'+b:''); } return m[1]+s+(m[3]||''); };
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=fmt(target*e); if(p<1) requestAnimationFrame(step); else el.textContent=txt; };
    el.textContent=fmt(0); requestAnimationFrame(step);
  });
}
function mountCharts(){
  Object.keys(CH).forEach(k=>{ try{ CH[k].destroy(); }catch(e){} delete CH[k]; });
  if(window.Chart){
    Chart.defaults.font.family = 'Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
    drawTrend(); drawMix(); drawMem(); drawSim();
  }
  if(document.getElementById('c-sim')) updateSim();
  countUp();
}

function route(){

const st = (k, pill) => `<span class="st ${k} ${pill?'pill':''}"><i></i>${k==='ok'?L('On track','达标'):k==='watch'?L('Watch','需关注'):L('Below plan','未达标')}</span>`;

function spark(arr, color){
  const w=92,h=30,mn=Math.min(...arr),mx=Math.max(...arr),rg=(mx-mn)||1;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*w).toFixed(1)},${(h-3-(v-mn)/rg*(h-8)).toFixed(1)}`);
  const last=pts[pts.length-1].split(',');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="${color||'#1C2B4A'}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color||'#1C2B4A'}"/></svg>`;
}
const metric = o => `<div class="card kpi ${o.cls||''}"><div class="kt"><span class="lbl">${o.lbl}${o.tip?tip(o.tip):''}</span>${o.st?st(o.st):''}</div><div class="kv"><span class="val">${o.val}</span>${o.spark?spark(o.spark,o.sc):''}</div><div class="sub">${o.delta?`<span class="delta ${o.delta[1]}">${o.delta[0]}</span>`:''}<span>${o.sub||''}</span></div></div>`;
function barChart(){
  const W=760,H=300,pl=46,pr=10,pt=26,pb=34,max=500,n=12,cw=(W-pl-pr)/n,bw=cw*.52;
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  [0,100,200,300,400,500].forEach(t=>{ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="${t?'#EFEAE0':'#D9D1C1'}"/><text x="${pl-10}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="#8A97A8">${t?'$'+t+'K':'$0'}</text>`; });
  const cx=i=>pl+cw*i+cw/2;
  ACT.forEach((a,i)=>{
    const miss=a<PLAN[i], v=((a/PLAN[i]-1)*100).toFixed(1);
    g+=`<rect x="${cx(i)-bw/2}" y="${y(a)}" width="${bw}" height="${y(0)-y(a)}" rx="4" fill="${miss?'#B8574A':'#1C2B4A'}" opacity="${i===11?1:.9}"><title>${T(MLBL)[i]}: ${L('actual','实际')} $${a}K · ${L('plan','计划')} $${PLAN[i]}K (${a>=PLAN[i]?'+':''}${v}%)</title></rect>`;
    g+=`<text x="${cx(i)}" y="${y(a)-7}" text-anchor="middle" font-size="10.5" font-weight="600" fill="${miss?'#A84B3A':'#3E4A5C'}">${a}</text>`;
    g+=`<text x="${cx(i)}" y="${H-12}" text-anchor="middle" font-size="11.5" fill="#3E4A5C">${T(MLBL)[i]}</text>`;
  });
  g+=`<polyline points="${PLAN.map((p,i)=>cx(i)+','+y(p)).join(' ')}" fill="none" stroke="#C8892E" stroke-width="2" stroke-dasharray="5 4"/>`;
  PLAN.forEach((p,i)=>{ g+=`<circle cx="${cx(i)}" cy="${y(p)}" r="3" fill="#fff" stroke="#C8892E" stroke-width="1.8"/>`; });
  return `<div class="chart"><div class="cscroll"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${L('Monthly revenue in thousands of dollars, actual bars versus plan line','月度营收（千美元）：实际柱状对比计划折线')}">${g}</svg></div>
  <div class="legend"><span><i style="background:#1C2B4A"></i>${L('Actual ($K)','实际（千美元）')}</span><span><i style="background:#B8574A"></i>${L('Below plan','低于计划')}</span><span><i style="background:transparent;border:2px dashed #C8892E;height:0;width:16px;border-radius:0;vertical-align:3px"></i>${L('Plan','计划')}</span></div></div>`;
}
function ytdBlock(){

const mY = iso => { const d=new Date(iso+'T12:00:00'); return S.lang==='zh' ? `${d.getFullYear()}年${d.getMonth()+1}月` : d.toLocaleDateString('en-US',{month:'short',year:'numeric'}); };
function valueChart(H){
  const pos=H.pos.slice().sort((a,b)=>a.d<b.d?-1:1); let cs=0,cc=0; const pts=[];
  pts.push({lb:L('Start','起点'),c:0,v:0});
  pos.forEach(p=>{ cs+=p.sh; cc+=p.inv; pts.push({lb:mY(p.d),c:cc,v:cs*p.p,r:T(p.r).split(' ·')[0]}); });
  pts.push({lb:L('Series A (if closed)','A 轮（如完成）'),c:cc,v:cs*PRICE.a,pf:true});
  const W=640,Hh=250,pl=58,pr=76,pt=30,pb=40, mx=Math.max(...pts.map(p=>p.v))*1.18;
  const x=i=>pl+(W-pl-pr)*i/(pts.length-1), y=v=>pt+(Hh-pt-pb)*(1-v/mx);
  let g='';
  [0,.25,.5,.75,1].forEach(f=>{ const v=mx*f; g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#EFEAE0"/><text x="${pl-10}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="#8A97A8">$${Math.round(v/1000)}K</text>`; });
  const solid=pts.slice(0,-1), last=pts.length-1;
  g+=`<path d="M${x(0)},${y(0)} ${solid.map((p,i)=>`L${x(i)},${y(p.v)}`).join(' ')} L${x(solid.length-1)},${y(0)} Z" fill="rgba(28,43,74,.07)"/>`;
  g+=`<polyline points="${pts.map((p,i)=>`${x(i)},${y(p.c)}`).join(' ')}" fill="none" stroke="#8A97A8" stroke-width="1.6" stroke-dasharray="3 4"/>`;
  g+=`<polyline points="${solid.map((p,i)=>`${x(i)},${y(p.v)}`).join(' ')}" fill="none" stroke="#1C2B4A" stroke-width="2.4"/>`;
  g+=`<line x1="${x(last-1)}" y1="${y(pts[last-1].v)}" x2="${x(last)}" y2="${y(pts[last].v)}" stroke="#C8892E" stroke-width="2.4" stroke-dasharray="6 5"/>`;
  pts.forEach((p,i)=>{ if(i===0) return;
    g+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="${p.pf?'#fff':'#1C2B4A'}" stroke="${p.pf?'#C8892E':'#1C2B4A'}" stroke-width="2"/>`;
    g+=`<text x="${x(i)}" y="${y(p.v)-12}" text-anchor="middle" font-size="12" font-weight="700" fill="${p.pf?'#9A6A1C':'#1C2B4A'}">${money(p.v)}</text>`; });
  pts.forEach((p,i)=>{ g+=`<text x="${x(i)}" y="${Hh-18}" text-anchor="middle" font-size="11" fill="#3E4A5C">${p.lb}</text>${p.r?`<text x="${x(i)}" y="${Hh-4}" text-anchor="middle" font-size="10.5" fill="#8A97A8">${p.r}</text>`:''}`; });
  return `<div class="chart"><div class="cscroll"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${L('Value of your investment compared with the amount invested','你的投资价值对比投入金额')}" style="min-width:520px">${g}</svg></div>
  <div class="legend"><span><i style="background:#1C2B4A"></i>${L('Value at each round price','按每轮价格计算的价值')}</span><span><i style="background:transparent;border-top:2px dashed #8A97A8;height:0;width:16px;border-radius:0;vertical-align:3px"></i>${L('Amount invested','投入金额')}</span><span><i style="background:transparent;border-top:2px dashed #C8892E;height:0;width:16px;border-radius:0;vertical-align:3px"></i>${L('If the Series A closes at $1.70','若 A 轮按 1.70 美元完成')}</span></div></div>`;
}
function tractionChart(){
  const d=[['2023',1.9],['2024',3.1],['2025',4.4],[L('TTM','近12月'),4.87],['2027E',8.2]];
  const W=340,H=280,pl=6,pb=30,pt=26,mx=9,cw=(W-pl*2)/d.length,bw=cw*.56,y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g=`<line x1="${pl}" x2="${W-pl}" y1="${y(0)}" y2="${y(0)}" stroke="#D9D1C1"/>`;
  d.forEach((r,i)=>{ const cx=pl+cw*i+cw/2, e=i===d.length-1;

  <div class="card"><div class="hd"><h3>${L('Recently published','最近发布')}</h3></div><div class="list">${posts().concat(NEWS0).slice(0,6).map(n=>`<div class="item" style="grid-template-columns:1fr auto"><div><div class="t" style="font-size:14px">${esc(T(n.t))}</div><div class="m">${fdate(n.d)} · ${n.aud==='bd'?L('Board only','仅董事会'):L('All shareholders','全体股东')}</div></div>${n.mine?`<span class="chip gold">${L('New','新')}</span>`:''}</div>`).join('')}</div>
  <p class="small muted" style="margin-top:10px">${L('Tip: publish something, then switch to Shareholder to see it appear.','提示：发布一条，再切换到"股东"身份查看效果。')}</p></div></div>`;
VIEWS.inbox = ()=>{
  const all = qaSh().map(q=>Object.assign({k:'sh'},q)).concat(qaPr().map(q=>Object.assign({k:'pr'},q)));
  const open = all.filter(q=>!q.a), done = all.filter(q=>q.a);
  return `<div class="card" style="margin-bottom:20px"><div class="hd"><h3>${L('Open questions','待回答')} · ${open.length}</h3><span class="small muted">${L('Target: reply within 48 hours','目标：48 小时内回复')}</span></div>
  ${open.length?open.map(q=>`<form class="thread" data-form="reply" data-id="${q.id}"><div class="q">${esc(T(q.q))}</div><div class="meta"><span>${esc(q.by)}</span><span>${fdate(q.d)}</span><span class="chip ${q.k==='pr'?'gold':'navy'}">${q.k==='pr'?L('Prospect','意向投资人'):L('Shareholder','股东')}</span></div>
    <div class="grid replyg" style="grid-template-columns:200px 1fr;gap:12px;margin-top:14px"><div class="field" style="margin:0"><label>${L('Owner','负责人')}</label><select name="who">${OWNERS.map(o=>`<option value="${o.n}" ${o.n===q.who?'selected':''}>${o.n} · ${T(o.r)}</option>`).join('')}</select></div>
    <div class="field" style="margin:0"><label>${L('Answer (shared with everyone in this audience)','回答（对该范围内所有人可见）')}</label><textarea name="a" rows="2" required maxlength="1500"></textarea></div></div>
    <div style="text-align:right;margin-top:10px"><button class="btn btn-navy btn-sm">${L('Send answer','发送回答')}</button></div></form>`).join(''):`<p class="muted">${L('All caught up.','全部处理完毕。')}</p>`}</div>
  <div class="card"><div class="hd"><h3>${L('Answered','已回答')} · ${done.length}</h3></div><div class="list">${done.map(q=>`<div class="item" style="grid-template-columns:auto 1fr auto"><span class="fileic" style="background:var(--ok-soft);color:var(--ok)">${ic('check',16)}</span><div><div class="t" style="font-size:14px">${esc(T(q.q))}</div><div class="m">${esc(q.by)} · ${L('answered by','回答人')} ${q.who}</div></div><span class="chip">${q.k==='pr'?L('Prospect','意向投资人'):L('Shareholder','股东')}</span></div>`).join('')}</div></div>`;
};
VIEWS.perms = ()=>{
  const cols = [['pub',L('Public','公开')],['pr',L('Prospects','意向投资人')],['sh',L('Shareholders','股东')],['bd',L('Board','董事会')]];
  return `<div class="notice navy">${ic('lock')} <span>${L('Decide who can open each file. Changes apply instantly — try turning a document on for Prospects, then sign in as a prospective investor.','设置每份文件谁能打开，修改即时生效。试着对"意向投资人"开放一份文件，再以意向投资人身份登录查看。')}</span></div>
  <div class="card"><div class="tblw"><table class="tbl perm"><tr><th>${L('Document','文件')}</th>${cols.map(c=>`<th style="text-align:center">${c[1]}</th>`).join('')}</tr>
  ${DOCS.map(d=>{ const a=DB.get('perm_'+d.id,d.aud); return `<tr><td><b style="font-weight:600">${T(d.n)}</b><div class="small muted">${d.k} · ${fdate(d.d)}</div></td>${cols.map(c=>`<td class="c"><button class="tog ${a[c[0]]?'on':''}" data-act="perm" data-id="${d.id}" data-c="${c[0]}" aria-label="${T(d.n)} ${c[1]}"></button></td>`).join('')}</tr>`; }).join('')}
  </table></div></div>`;
};
VIEWS.reads = ()=>{
  const rc = readCount(), unread = UNREAD_SAMPLE.slice(0, 61-rc > UNREAD_SAMPLE.length ? UNREAD_SAMPLE.length : 61-rc);
  const reminded = DB.get('reminded',false);
  return `<div class="grid g3" style="margin-bottom:20px">${kpi(L('Q3 report','三季报'),pct(rc/61,0),`${rc} ${L('of 61 opened','/ 61 人已打开')}`,'feature')}${kpi(L('Q2 report','二季报'),'89%',L('54 of 61','54 / 61 人'))}${kpi(L('Avg. time to open','平均打开时间'),L('1.6 days','1.6 天'),L('after publishing','发布后'))}</div>
  <div class="grid g2">
    <div class="card"><div class="hd"><h3>${L('Q3 2026 Quarterly Report','2026 年第三季度报告')}</h3><span class="small muted">${L('Published Oct 28','10月28日发布')}</span></div>
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px"><span>${L('Opened','已打开')}</span><b>${rc} / 61</b></div><div class="bar ok"><i style="width:${rc/61*100}%"></i></div>
      ${DB.get('readq3',false)?`<p class="small up" style="margin-top:12px">${ic('check',13)} ${L('Daniel Chen opened it just now.','Daniel Chen 刚刚打开了报告。')}</p>`:''}
      <div class="list" style="margin-top:14px">${[[L('Opened on day 1','第 1 天打开'),31],[L('Opened within a week','一周内打开'),12],[L('Opened later','之后打开'),rc-43]].map(r=>`<div class="item" style="grid-template-columns:1fr auto;padding:10px 0"><span style="font-size:14px">${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></div>
    <div class="card"><div class="hd"><h3>${L('Not opened yet','尚未打开')} · ${61-rc}</h3><button class="btn btn-gold btn-sm" data-act="remind" ${reminded?'disabled':''}>${reminded?L('✓ Reminder sent','✓ 已发送提醒'):L('Send reminder','发送提醒')}</button></div>
      <div class="list">${unread.map(n=>`<div class="item" style="grid-template-columns:auto 1fr auto;padding:9px 0"><span class="avatar" style="width:32px;height:32px;font-size:12px;background:var(--sand);color:var(--navy)">${n.split(' ').map(x=>x[0]).join('')}</span><span style="font-size:14px">${n}</span><span class="small muted">${reminded?L('reminded','已提醒'):''}</span></div>`).join('')}</div>
      ${61-rc>unread.length?`<p class="small muted" style="margin-top:8px">+${61-rc-unread.length} ${L('more','人')}</p>`:''}</div>
  </div>`;
};

/* ============================================================
   EVENTS
   ============================================================ */
const app = document.getElementById('app');
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function modal(html){ const m=document.getElementById('modal'); m.innerHTML=`<div class="ov" data-act="close"><div class="modal" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Close">×</button>${html}</div></div>`; }
function rerender(){ route(); }

document.addEventListener('click', e=>{
  if(e.target.closest('.side nav a')) S.report = null;
  if(document.body.classList.contains('nav-open') && !e.target.closest('.side') && !e.target.closest('[data-act="menu"]')) document.body.classList.remove('nav-open');
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act;
  if(a==='close'){ if(e.target===el || el.classList.contains('x')) document.getElementById('modal').innerHTML=''; return; }
  if(a==='anchor'){ e.preventDefault(); const t=document.getElementById(el.dataset.to); if(t) t.scrollIntoView({behavior:'smooth'}); return; }
  if(a==='lang'){ S.lang = S.lang==='en'?'zh':'en'; DB.set('lang',S.lang); document.documentElement.lang = S.lang==='zh'?'zh-CN':'en'; const y=window.scrollY; rerender(); window.scrollTo(0,y); return; }
  if(a==='menu'){ document.body.classList.toggle('nav-open'); return; }
  if(a==='role'){ const r=el.dataset.role; S.role=r; DB.set('role',r); S.report=null; S.deck=0; location.hash = r==='visitor' ? '#/' : '#/p/'+NAV[r][0][0]; return; }
  if(a==='logout'){ S.role=null; DB.set('role',null); return; }
  if(a==='reset'){ e.preventDefault(); const l=S.lang; DB.clear(); DB.set('lang',l); S.role=null; S.report=null; toast(L('Demo data reset','演示数据已重置')); rerender(); return; }
  if(a==='tip'){ e.preventDefault(); e.stopPropagation(); const g=GLOSS[el.dataset.k]; if(g) modal(`<div class="gloss"><div class="eyebrow">${L('Plain-English glossary','白话术语解释')}</div><h3>${T(g.t)}</h3><p style="color:var(--ink-2);font-size:15.5px">${T(g.d)}</p>${g.ex?`<div class="ex"><b>${L('Example','举例')}:</b> ${T(g.ex)}</div>`:''}</div>`); return; }
  if(a==='perf'){ S.perfTab=el.dataset.t; rerender(); return; }
  if(a==='perftab'){ S.perfTab=el.dataset.t; if(location.hash==='#/p/perf'){ e.preventDefault(); rerender(); } return; }
  if(a==='metric'){ S.metric=el.dataset.m; el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el)); drawTrend(); return; }
  if(a==='range'){ S.range=el.dataset.r; el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el)); drawTrend(); return; }
  if(a==='pin'){ S.pin=el.dataset.id||null; const ms=document.getElementById('mapsvg'), pi=document.getElementById('pin-info'); if(ms) ms.innerHTML=mapSvg(); if(pi) pi.innerHTML=pinInfo(S.pin); return; }
  if(a==='preset'){ const cur=simState(); DB.set('sim', Object.assign(cur, PRESETS[el.dataset.p])); const v=simState(); ['stores','rps','mult'].forEach(k=>{ const i=document.getElementById('sim-'+k); if(i) i.value=v[k]; }); updateSim(); return; }
  if(a==='photo'){ const p=PHOTOS[+el.dataset.i]; modal(`<div class="lightbox"><div class="eyebrow">${fdate(p.d)}</div><h3>${esc(T(p.t))}</h3><img src="${IMG[p.img]}" alt="${esc(T(p.t))}"></div>`); return; }
  if(a==='deck'){ S.deck=Math.max(0,Math.min(SLIDES().length-1,S.deck+(+el.dataset.d))); rerender(); return; }
  if(a==='report' || a==='openq3'){ const r = a==='openq3' ? 'q3' : el.dataset.r;
    if(r && r!=='q3'){ const rep=REPORTS.find(x=>x.id===r); modal(`<div class="eyebrow">${T(rep.k)} · ${fdate(rep.d)}</div><h3>${T(rep.t)}</h3><p class="muted">${L('Archived report. In this demo only the Q3 2026 report opens in full.','往期报告。本演示中只有 2026 年第三季度报告可以完整打开。')}</p><div class="docprev">${docLines()}${wm()}</div>`); return; }
    S.report = r||null; if(r==='q3') DB.set('readq3',true); if(a==='openq3'){ e.preventDefault(); location.hash='#/p/reports'; } rerender(); window.scrollTo(0,0); return; }
  if(a==='doc'){ const n=el.dataset.name; modal(`<div class="eyebrow">${L('Secure viewer','安全查看器')}</div><h3>${esc(n)}</h3><p class="small muted">${L('View-only · watermarked · access is logged','仅可查看 · 带水印 · 访问会被记录')}</p><div class="docprev">${docLines()}${wm()}</div>`); return; }
  if(a==='vote'){ DB.set('vote',el.dataset.v); toast(L('Vote recorded','投票已记录')); rerender(); return; }
  if(a==='rsvp'){ DB.set('rsvp',el.dataset.v); rerender(); return; }
  if(a==='rec'){ modal(`<div class="eyebrow">${L('Meeting recording','会议录像')}</div><h3>${L('2025 Annual Shareholder Meeting','2025 年度股东大会')}</h3><div class="slide img" style="background-image:url('${IMG.team}');margin-top:16px;align-items:center;justify-content:center"><span style="width:72px;height:72px;border-radius:50%;background:var(--gold);display:grid;place-items:center">${ic('play',30)}</span></div><p class="small muted" style="margin-top:12px">${L('Demo placeholder — in production the recording, slides and minutes are attached here.','演示占位：正式使用时，这里会附上录像、幻灯片和会议纪要。')}</p>`); return; }
  if(a==='sign'){ DB.set('signed',true); toast(L('Written consent signed · 3 of 3 — resolution approved','书面决议已签署 · 3/3 — 决议通过')); rerender(); return; }
  if(a==='prorata'){ DB.set('prorata',true); const P=pipe(); const me=P.find(p=>p.id==='p8'); if(me) me.s='soft'; DB.set('pipe',P); toast(L('Participation indicated — the CFO has been notified','已表达认购意向，财务长已收到通知')); rerender(); return; }
  if(a==='commit'){ const me=pipe().find(p=>p.id==='p10');
    modal(`<div class="eyebrow">${L('Non-binding indication','不具约束力的意向')}</div><h3>${L('How much are you considering?','你考虑投资多少？')}</h3><p class="muted" style="margin-bottom:18px">${L('This only helps the company plan the round. Nothing is charged and nothing is signed here.','这只用于帮助公司规划本轮融资。这里不收任何款项，也不签任何文件。')}</p>
    <form data-form="commit"><div class="field"><label>${L('Amount (USD, minimum $50,000)','金额（美元，最低 50,000）')}</label><input name="amt" type="number" min="50000" step="5000" required value="${me&&me.a?me.a:100000}"></div><button class="btn btn-gold">${L('Submit indication','提交意向')}</button></form>`); return; }
  if(a==='slot'){ DB.set('call',el.dataset.v); toast(L('Call booked','通话已预约')); rerender(); return; }
  if(a==='advance'){ const P=pipe(); const p=P.find(x=>x.id===el.dataset.id); const i=STAGES.findIndex(s=>s.k===p.s); if(i<STAGES.length-1){ p.s=STAGES[i+1].k; p.fresh=false; if(p.s==='soft'&&!p.a) p.a=100000; } DB.set('pipe',P); rerender(); return; }
  if(a==='perm'){ const d=DOCS.find(x=>x.id===el.dataset.id); const cur=Object.assign({},DB.get('perm_'+d.id,d.aud)); cur[el.dataset.c]=!cur[el.dataset.c]; DB.set('perm_'+d.id,cur); el.classList.toggle('on'); toast(L('Access updated','权限已更新')); return; }
  if(a==='remind'){ DB.set('reminded',true); toast(L(`Reminder sent to ${61-readCount()} shareholders`,`已向 ${61-readCount()} 位股东发送提醒`)); rerender(); return; }
  if(a==='export'){ toast(L('In production this downloads the registry as CSV','正式使用时会下载 CSV 格式的股东名册')); return; }
});
const docLines = () => Array.from({length:12},(_,i)=>`<div class="ln" style="width:${[92,100,86,97,64,100,90,78,100,95,70,40][i]}%;${i===0?'height:18px;width:55%;background:#D6CDBB;margin-bottom:22px':''}"></div>`).join('');
const wm = () => { const n = S.role && ROLES[S.role].n ? ROLES[S.role].n : 'Visitor'; return `<div class="wm">${Array.from({length:30},()=>`<span>${n} · ${L('CONFIDENTIAL','保密')} · ${TODAY}</span>`).join('')}</div>`; };

document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-form]'); if(!f) return;
  e.preventDefault();
  const k = f.dataset.form, fd = new FormData(f);
  if(k==='interest'){
    if(fd.get('website')) return; // honeypot
    const last = DB.get('lastsub',0); if(Date.now()-last<5000){ toast(L('Please wait a moment before submitting again','请稍候再提交')); return; }
    DB.set('lastsub',Date.now());
    const name = String(fd.get('name')).trim().slice(0,80);
    const P = pipe(); P.push({id:'w'+Date.now(), n:name, t:{en:String(fd.get('type')),zh:String(fd.get('type'))}, a:0, s:'interested', fresh:true}); DB.set('pipe',P);
    DB.set('pubread',name); renderPublic(); document.getElementById('interest').scrollIntoView(); toast(L('Interest registered','意向已登记')); return;
  }
  if(k==='gate'){ DB.set('gate',true); rerender(); return; }
  if(k==='commit'){ const amt=Math.max(50000,+fd.get('amt')||0); const P=pipe(); const me=P.find(p=>p.id==='p10'); me.a=amt; me.s='soft'; DB.set('pipe',P); document.getElementById('modal').innerHTML=''; toast(L('Indication received — thank you','意向已收到，谢谢')); rerender(); return; }
  if(k==='shqa' || k==='prqa'){
    const q = String(fd.get('q')).trim().slice(0,500); if(!q) return;
    const fin = /revenue|cost|margin|cash|price|valuation|dividend|tax|营收|成本|利润|现金|估值|税|价格/i.test(q);
    const store = /store|open|lease|bake|menu|staff|门店|开业|租|面包|员工/i.test(q);
    const o = fin?OWNERS[0]:store?OWNERS[2]:OWNERS[1];
    const R = ROLES[S.role];
    const list = DB.get(k==='shqa'?'myqa':'prqa',[]);
    list.push({id:(k==='shqa'?'u':'v')+Date.now(), by:R.n, d:TODAY, aud:k==='shqa'?'sh':'pr', q:{en:q,zh:q}, who:o.n, role:o.r, due:48, a:null});
    DB.set(k==='shqa'?'myqa':'prqa',list);
    toast(L(`Sent to ${o.n} (${T(o.r)}) — reply within 48h`,`已发送给 ${o.n}（${T(o.r)}），48 小时内回复`)); rerender(); return;
  }
  if(k==='publish'){
    const t=String(fd.get('t')).trim(), b=String(fd.get('b')).trim(); if(!t||!b) return;
    const P = posts(); P.unshift({id:'m'+Date.now(), d:TODAY, tag:{en:String(fd.get('tag')),zh:String(fd.get('tag'))}, aud:fd.get('aud'), t:{en:t,zh:t}, b:{en:b,zh:b}, mine:true}); DB.set('posts',P);
    toast(fd.get('email')?L('Published · email & push sent to 61 shareholders','已发布 · 已向 61 位股东发送邮件和推送'):L('Published','已发布')); rerender(); return;
  }
  if(k==='reply'){
    const id=f.dataset.id, a=String(fd.get('a')).trim(), who=String(fd.get('who')); if(!a) return;
    const o = OWNERS.find(x=>x.n===who);
    DB.set('reply_'+id, {a:{en:a,zh:a}, who:o.n, role:o.r, ad:TODAY});
    toast(L('Answer sent and shared','回答已发送并共享')); rerender(); return;
  }
});

document.addEventListener('input', e=>{
  const k = e.target.dataset && e.target.dataset.sim; if(!k) return;
  const cur = simState(); cur[k] = k==='part' ? e.target.checked : parseFloat(e.target.value); DB.set('sim', cur); updateSim();
});
document.addEventListener('keydown', e=>{
  if((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('pin')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); return; } if(e.key==='Escape'){ document.getElementById('modal').innerHTML=''; document.body.classList.remove('nav-open'); } });
document.documentElement.lang = S.lang==='zh'?'zh-CN':'en';
route();
</script>
